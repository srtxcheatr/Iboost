name: Build iBoost X APK

# Runs automatically every time you push to GitHub (from Termux, the web
# editor, anywhere). Also runs on pull requests, and can be triggered by
# hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # No gradlew wrapper jar is committed to the repo (it's a binary
      # file), so this step provisions a real Gradle install for the
      # runner and puts it on PATH as `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iBoostX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release build only runs once you've added signing secrets (see
      # BUILD_INSTRUCTIONS.md). GitHub Actions doesn't allow the `secrets`
      # context inside an `if:` condition directly, so we check for the
      # secret inside a normal run step (where secrets ARE allowed) and
      # expose the result as a step output that later `if:` conditions
      # can reference instead.
      - name: Check for release signing secret
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.check_secrets.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build signed release APK
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release APK
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iBoostX-release-apk
          path: app/build/outputs/apk/release/app-release.apk
